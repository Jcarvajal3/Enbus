# CI del monorepo EnBus: tipos, lint y build de cada subproyecto, y comprobación de shared/.
# Sin secretos: los builds de Next usan variables de entorno ficticias (nada se conecta a Supabase).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  shared:
    name: shared (generados y pruebas)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Los *.generated.* coinciden con shared/
        run: node shared/generar.mjs --check
      - name: Pruebas de ve.ts y artefactos.ts
        working-directory: shared
        run: npm test

  landing:
    name: LandingEnBus
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: LandingEnBus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: LandingEnBus/package-lock.json
      - run: npm ci
      - name: Tipos
        run: npx tsc --noEmit
      - name: Lint (0 errores, 0 avisos)
        run: npx eslint . --max-warnings=0
      - name: Build
        # Sin variables de Supabase la landing se construye igual: las secciones con datos se ocultan.
        run: npm run build

  panel:
    name: PanelCooperativas
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: PanelCooperativas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: PanelCooperativas/package-lock.json
      - run: npm ci
      - name: Tipos
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        env:
          # Valores ficticios: el build no consulta la base (las páginas del panel son dinámicas).
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_COOPERATIVAS_URL: https://panel.example.com
          NEXT_PUBLIC_SITIO_URL: https://www.example.com
        run: npm run build

  app:
    name: EnBusApp
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: EnBusApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: EnBusApp/package-lock.json
      - run: npm ci
      - name: Tipos
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
